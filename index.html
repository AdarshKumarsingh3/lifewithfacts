<body>

    <nav class="nav">
        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJWcR81G3neBo-KLXXYOgYJHpdyEXr-2BPaNS_cY_fpOdzB52bk8zU0os&s=10"

            </div>
            <button class="login" id="loginBtn">LOG IN</button>

            <p>
                <strong>Username:</strong>

                <strong>User ID:</strong>

            <p id="popupUID" class="uid"></p>

            <label for="bio">Bio</label>
            <textarea
                id="bio"
                placeholder="Write something about yourself..."
            ></textarea>

            <button id="saveBio">Save Bio</button>
        </div>

    <main class="main-content">
        <div class="h1">Life with facts</div>

        <div class="smt">Wanna get interesting??</div>

        <button class="rq" id="nextQuestionBtn">Random question</button>
        <div class="ra" id="answerBox">Get answer</div>
