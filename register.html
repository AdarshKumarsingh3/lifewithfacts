
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="fregister.css">
</head>

<body>

    <div class="box">

        <h1>Create Account</h1>

        <p>Register to continue your journey</p>

        <form id="registerForm">

            <input
                type="text"
                class="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                class="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                class="password"
                placeholder="Password"
                required
            >

            <button type="submit" id="registerBtn">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script type="module" src="fregister.js"></script>

</body>

</html>
